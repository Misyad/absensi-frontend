<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4a62a">
    <meta name="description" content="Absensi relawan SPPG dengan foto dan lokasi">
    <title>Absensi Relawan SPPG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-shell">
        <header class="hero">
            <nav class="topbar" aria-label="Header aplikasi">
                <a class="brand" href="#" aria-label="Beranda SPPG">
                    <span class="brand-mark" aria-hidden="true">S</span>
                    <span>SPPG</span>
                </a>
                <span class="online-badge"><i></i> Online</span>
            </nav>

            <section class="welcome">
                <div>
                    <p class="eyebrow">ABSENSI RELAWAN</p>
                    <h1>Halo, <span>Relawan</span></h1>
                </div>
                <div class="avatar" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/></svg>
                </div>
            </section>

            <section class="clock-card" aria-label="Waktu saat ini">
                <div>
                    <p class="clock-label">Waktu sekarang</p>
                    <time id="currentTime" class="clock-time">--:--</time>
                    <p id="currentDate" class="clock-date">Memuat tanggal...</p>
                </div>
                <div class="clock-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                </div>
            </section>

            <div class="location-pill" aria-live="polite">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
                <span><strong>Lokasi Anda</strong><small id="locationText">Sedang mengambil lokasi...</small></span>
                <span id="locationIndicator" class="location-indicator is-loading" aria-hidden="true"></span>
            </div>
        </header>

        <section class="form-sheet">
            <div class="sheet-handle" aria-hidden="true"></div>
            <div class="section-heading">
                <div>
                    <p class="section-kicker">KEHADIRAN HARI INI</p>
                    <h2>Isi Data Absensi</h2>
                </div>
                <span class="step-badge">01</span>
            </div>

            <form id="formAbsen" novalidate>
                <div class="field-grid">
                    <div class="field-group">
                        <label for="divisi">Divisi</label>
                        <div class="select-wrap">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-9l8-4 8 4v9M9 21v-5h6v5M12 8V3M9 3h6"/></svg>
                            <select id="divisi" name="divisi" required disabled>
                                <option value="">Memuat data...</option>
                            </select>
                        </div>
                    </div>

                    <div class="field-group">
                        <label for="nama">Nama Relawan</label>
                        <div class="select-wrap">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/></svg>
                            <select id="nama" name="nama" required disabled>
                                <option value="">Pilih divisi dahulu</option>
                            </select>
                        </div>
                    </div>
                </div>

                <fieldset class="attendance-type">
                    <legend>Jenis Absensi</legend>
                    <div class="type-options">
                        <label class="type-card">
                            <input type="radio" name="jenisPilihan" value="Masuk" checked>
                            <span class="type-icon masuk"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6M15 12H3M21 3v18h-6"/></svg></span>
                            <span><strong>Masuk</strong><small>Mulai jam kerja</small></span>
                            <i></i>
                        </label>
                        <label class="type-card">
                            <input type="radio" name="jenisPilihan" value="Pulang">
                            <span class="type-icon pulang"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6M9 12h12M3 3v18h6"/></svg></span>
                            <span><strong>Pulang</strong><small>Selesai jam kerja</small></span>
                            <i></i>
                        </label>
                    </div>
                    <select id="jenis" name="jenis" aria-hidden="true" tabindex="-1">
                        <option value="Masuk">Masuk</option>
                        <option value="Pulang">Pulang</option>
                    </select>
                </fieldset>

                <div class="photo-section">
                    <div class="photo-title">
                        <div><span>Foto Selfie</span><small>Pastikan wajah terlihat jelas</small></div>
                        <span id="photoStatus" class="required-badge">WAJIB</span>
                    </div>
                    <label class="photo-upload" for="foto">
                        <input type="file" id="foto" accept="image/*" capture="user" required>
                        <img id="photoPreview" alt="Pratinjau foto absensi">
                        <span id="photoPlaceholder" class="photo-placeholder">
                            <span class="camera-icon"><svg viewBox="0 0 24 24"><path d="M4 7h3l2-3h6l2 3h3v13H4V7Z"/><circle cx="12" cy="13" r="4"/></svg></span>
                            <strong>Ambil Foto Selfie</strong>
                            <small>Ketuk untuk membuka kamera</small>
                        </span>
                        <span id="photoChange" class="photo-change">Ganti foto</span>
                    </label>
                    <canvas id="canvas" hidden></canvas>
                </div>

                <input type="hidden" id="statusLokasi" name="statusLokasi" value="Mengambil lokasi...">
                <input type="hidden" id="jarak" name="jarak" value="0">
                <input type="hidden" id="radius" name="radius" value="0">

                <button type="submit" id="btnSubmit" class="submit-button">
                    <span>Kirim Absensi</span>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </button>
                <div id="pesan" class="message" role="status" aria-live="polite"></div>
            </form>

            <p class="privacy-note">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10V8a6 6 0 0 1 12 0v2M5 10h14v11H5V10Z"/></svg>
                Foto dan lokasi hanya digunakan untuk validasi kehadiran.
            </p>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
